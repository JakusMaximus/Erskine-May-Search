<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erskine May Search Tool</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 { color: #005a36; } /* UK Parliament Green */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #005a36;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #004026; }
    .result-card {
      background: #f9f9f9;
      border-left: 4px solid #005a36;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-radius: 0 6px 6px 0;
    }
    .ref-tag {
      font-weight: bold;
      color: #555;
      font-size: 0.9em;
    }
    .loading { color: #666; font-style: italic; }
  </style>
</head>
<body>

  <h1>Erskine May Search</h1>
  <p>Search paragraphs in Erskine May (Parliamentary Procedure Guide).</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="e.g. casting vote, privilege, speaker..." onkeypress="handleKey(event)">
    <button onclick="searchErskineMay()">Search</button>
  </div>

  <div id="resultsContainer"></div>

  <script>
    async function searchErskineMay() {
      const query = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('resultsContainer');

      if (!query) {
        container.innerHTML = '<p>Please enter a search word or phrase.</p>';
        return;
      }

      container.innerHTML = '<p class="loading">Searching Erskine May API...</p>';

      try {
        // Fetch data from Parliament's public Erskine May search API
        const url = `https://erskinemay-api.parliament.uk/api/Search/ParagraphSearchResults/${encodeURIComponent(query)}`;
        const response = await fetch(url);

        if (!response.ok) throw new Error('API request failed');

        const data = await response.json();

        // Check if results exist in the response
        const results = data.searchResults || data;

        if (!results || results.length === 0) {
          container.innerHTML = '<p>No results found for that query.</p>';
          return;
        }

        // Render search results
        let html = `<p>Found <strong>${results.length}</strong> matching paragraph(s):</p>`;

        results.slice(0, 20).forEach(item => {
          const reference = item.reference || 'Ref N/A';
          const content = item.contentTextHtml || item.contentText || 'No preview text available.';
          
          html += `
            <div class="result-card">
              <div class="ref-tag">Paragraph ${reference}</div>
              <div>${content}</div>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color:red;">Error fetching data from Erskine May API. Make sure the API is accessible.</p>';
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') searchErskineMay();
    }
  </script>

</body>
</html>
