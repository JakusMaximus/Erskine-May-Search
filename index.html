<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erskine May Search Tool</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 { color: #005a36; margin-bottom: 5px; } /* UK Parliament Green */
    .subtitle { color: #666; margin-top: 0; margin-bottom: 25px; }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #005a36;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #004026; }
    .result-card {
      background: #f9f9f9;
      border-left: 5px solid #005a36;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }
    .ref-header {
      font-weight: bold;
      color: #005a36;
      font-size: 1.15em;
      margin-bottom: 10px;
    }
    .read-btn {
      margin-top: 15px;
      padding: 8px 14px;
      font-size: 14px;
      background-color: #ffffff;
      color: #005a36;
      border: 1px solid #005a36;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .read-btn:hover {
      background-color: #005a36;
      color: white;
    }
    .full-content {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #ccc;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 6px;
    }
    .loading { color: #666; font-style: italic; }
  </style>
</head>
<body>

  <h1>Erskine May Search</h1>
  <p class="subtitle">Search the official guide to UK Parliamentary Procedure</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="e.g. financial privilege, casting vote, speaker..." onkeypress="handleKey(event)">
    <button onclick="searchErskineMay()">Search</button>
  </div>

  <div id="resultsContainer"></div>

  <script>
    async function searchErskineMay() {
      const query = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('resultsContainer');

      if (!query) {
        container.innerHTML = '<p>Please enter a search word or phrase.</p>';
        return;
      }

      container.innerHTML = '<p class="loading">Searching Erskine May API...</p>';

      try {
        const url = `https://erskinemay-api.parliament.uk/api/Search/ParagraphSearchResults/${encodeURIComponent(query)}`;
        const response = await fetch(url);

        if (!response.ok) throw new Error('API search failed');

        const data = await response.json();
        const results = data.searchResults || [];

        if (results.length === 0) {
          container.innerHTML = '<p>No matching paragraphs found.</p>';
          return;
        }

        let html = `<p>Found <strong>${results.length}</strong> matching result(s):</p>`;

        results.forEach((item, index) => {
          // Get reference (e.g. "21.3" or section name)
          const ref = item.reference || item.paragraphPrefix || `Result #${index + 1}`;
          const snippetText = item.contentTextHtml || item.contentText || '';

          html += `
            <div class="result-card">
              <div class="ref-header">Paragraph ${ref}</div>
              <div class="snippet">${snippetText}</div>
              <button class="read-btn" onclick="fetchFullParagraph('${ref}', this)">Read Full Explanation</button>
              <div class="full-content" id="full-${index}" style="display:none;"></div>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color:red;">Error fetching search results from Erskine May API.</p>';
      }
    }

    async function fetchFullParagraph(ref, buttonElem) {
      const parentCard = buttonElem.parentElement;
      let fullDiv = parentCard.querySelector('.full-content');

      // Toggle display if already loaded
      if (fullDiv.style.display === 'block') {
        fullDiv.style.display = 'none';
        buttonElem.innerText = 'Read Full Explanation';
        return;
      }

      buttonElem.innerText = 'Loading full text...';

      try {
        // Fetch full detail for this exact paragraph reference
        const response = await fetch(`https://erskinemay-api.parliament.uk/api/Search/Paragraph/${encodeURIComponent(ref)}`);
        
        if (!response.ok) throw new Error('Could not load full text');

        const fullData = await response.json();
        
        // Extract paragraph text or html content from returned detail payload
        let fullHtml = fullData.contentTextHtml || fullData.contentText || fullData.htmlContent || fullData.content || '';

        // If the endpoint returns sub-paragraphs/sections
        if (!fullHtml && fullData.sections) {
          fullHtml = fullData.sections.map(s => s.contentTextHtml || s.contentText || '').join('<br><br>');
        }

        if (!fullHtml) {
          fullHtml = '<p><em>Full text unavailable for this specific section reference.</em></p>';
        }

        fullDiv.innerHTML = fullHtml;
        fullDiv.style.display = 'block';
        buttonElem.innerText = 'Hide Full Explanation';

      } catch (err) {
        console.error(err);
        buttonElem.innerText = 'Read Full Explanation';
        alert('Could not fetch the full paragraph text. Please try another entry.');
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') searchErskineMay();
    }
  </script>

</body>
</html>
